<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人间有信 · 通讯录</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">✳</span><span>人间有信<small>CONTACT BOOK</small></span></div><div class="side-label">我的通讯录</div><nav><button class="nav active" data-filter="all"><span>▦</span>全部联系人 <b id="all-count">0</b></button><button class="nav" data-filter="favorites"><span>♡</span>星标联系人 <b id="favorite-count">0</b></button></nav><div class="side-bottom"><div class="side-illustration">✦</div><strong>把重要的人，<br>好好留在身边。</strong><p>一份简单、安静的通讯录。</p></div></aside>
<main><header class="topbar"><div><span class="eyebrow">YOUR LITTLE BLACK BOOK</span><h1 id="title">全部联系人</h1><p id="subtitle">所有值得记住的人，都在这里。</p></div><button id="add" class="primary">＋ <span>新建联系人</span></button></header><section class="summary"><div><span class="summary-icon">✳</span><span><small>联系人总数</small><strong id="summary-total">0</strong></span></div><div><span class="summary-icon pink">♡</span><span><small>星标联系人</small><strong id="summary-star">0</strong></span></div><p>人与人之间的连接，<br>从一个名字开始。 <span>↗</span></p></section><section class="content"><div class="content-head"><div><h2>联系人列表 <span id="visible-count">0</span></h2><p>点击联系人可查看或编辑详细信息</p></div><div class="actions"><label class="search"><span>⌕</span><input id="search" placeholder="搜索姓名、电话或邮箱" autocomplete="off"></label><button class="outline" id="import-btn">↑ 导入</button><a class="outline" href="/api/export">↓ 导出</a><input type="file" id="file" accept=".xlsx" hidden></div></div><div class="table-head"><span>联系人</span><span>联系方式</span><span>公司 / 备注</span><span></span></div><div id="list"></div><div id="empty" class="empty" hidden><div>✳</div><h3>这里还是空的</h3><p>添加一位联系人，让故事从这里开始。</p><button class="outline" id="empty-add">＋ 新建联系人</button></div></section><footer>人间有信 <span>·</span> 让每一次联系，都有迹可循</footer></main></div>
<dialog id="dialog"><form id="form"><div class="modal-head"><div><span class="eyebrow">CONTACT DETAILS</span><h2 id="form-title">新建联系人</h2><p>记下关于这个人的一点信息。</p></div><button type="button" class="close" id="close" aria-label="关闭">×</button></div><div class="form-grid"><label class="wide">姓名 <em>*</em><input name="name" required maxlength="100" placeholder="怎么称呼？"></label><label>电话 <small>多个号码请换行</small><textarea name="phones" rows="2" placeholder="输入电话号码"></textarea></label><label>邮箱 <small>多个邮箱请换行</small><textarea name="emails" rows="2" placeholder="输入邮箱地址"></textarea></label><label>公司<input name="company" placeholder="工作单位或组织"></label><label>地址<input name="address" placeholder="所在城市或地址"></label><label class="wide">备注<textarea name="note" rows="2" placeholder="写点什么，方便以后想起来"></textarea></label></div><label class="favorite-toggle"><input type="checkbox" name="favorite"> <span>♡ 加入星标联系人</span></label><div class="modal-actions"><button type="button" class="outline danger" id="delete" hidden>删除联系人</button><span class="spacer"></span><button type="button" class="outline" id="cancel">取消</button><button class="primary" type="submit">保存联系人</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="/app.js"></script></body></html>
